services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spaced_repetition
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cap memory so Redis can't grow without limit. The policy MUST stay
    # "noeviction": this one Redis also holds the BullMQ email queue, and
    # BullMQ needs every key it writes to stay (an evicted job or job lock is
    # a lost or duplicated email; BullMQ warns at startup otherwise). When
    # full, Redis refuses new writes instead: the due-items cache write
    # already ignores that error, and cache keys expire on their own (EX).
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      # .env's DATABASE_URL/REDIS_URL point at localhost, which is wrong
      # inside the compose network -- override them to the service names.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/spaced_repetition
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      # .env's REDIS_URL points at localhost, which is wrong inside the
      # compose network -- override it to the service name.
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

volumes:
  db_data:
  redis_data:
