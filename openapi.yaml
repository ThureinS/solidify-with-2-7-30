openapi: 3.0.3
info:
  title: Spaced Repetition Review Tracker API
  description: >
    Backend for a personal spaced-repetition learning tracker. Each item
    picks one of two scheduling modes at creation (see CONTEXT.md):
    Fixed Mode is the original 2-7-30 ladder, generalized so the final
    interval is configurable -- the first review is due 2 calendar days
    after an item is added, the next is scheduled 7 days from the
    completion date, then a configurable final interval (default 30),
    after which the item archives. Adaptive Mode uses FSRS: each review
    takes a Grade (Again/Hard/Good/Easy) and the next interval is computed
    from the item's own Difficulty/Stability, with no fixed ceiling and no
    archiving.
    Every `date` field (query or body) is the client's calendar date in
    YYYY-MM-DD form and must be a real date: an impossible one such as
    2026-02-30 is rejected with 400 VALIDATION_ERROR.

    Auth: log in for a short-lived access token (a JWT, 30 minutes) and a
    refresh token (30 days). Send the access token as `Authorization: Bearer`.
    When it expires, trade the refresh token at `/auth/refresh` for a new pair.

    Public demo: every `/items` GET path and `/export` also exist under
    `/demo` (for example `GET /demo/items/due?date=...`) with no token. They
    always serve the fixed demo account and are read-only: any write answers
    403 DEMO_READ_ONLY. If that account doesn't exist yet, they answer 503
    DEMO_NOT_SEEDED.
  version: 1.0.0
servers:
  - url: /api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
      example:
        error:
          message: Item not found
          code: NOT_FOUND

    AuthUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [USER, ADMIN] }
        isSuspended: { type: boolean }
        createdAt: { type: string, format: date-time }
        isDemo:
          type: boolean
          description: True only for the public read-only demo account. Its writes return 403 DEMO_READ_ONLY.

    TokenPair:
      type: object
      properties:
        accessToken: { type: string, description: JWT for the Authorization header; expires after 30 minutes }
        refreshToken: { type: string, description: Opaque token for /auth/refresh and /auth/logout; expires after 30 days; each use replaces it }
      example:
        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken: 3q2-7w0pZJmR0b4n9mN1xQ...

    RefreshTokenBody:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        result: { type: string, enum: [REVIEWED, SKIPPED] }
        grade:
          type: string
          enum: [AGAIN, HARD, GOOD, EASY]
          nullable: true
          description: Set only for Adaptive Mode REVIEWED rows; null for Fixed Mode and for every SKIPPED row.

    ItemCore:
      type: object
      properties:
        id: { type: string, format: uuid }
        mode: { type: string, enum: [FIXED, ADAPTIVE] }
        dateAdded: { type: string, format: date }
        nextReviewDate: { type: string, format: date }

    # Present only when mode = FIXED. Omitted entirely for Adaptive items --
    # they never archive and have no ladder rungs, so these fields would
    # claim progress that isn't real (see ADR 0003).
    FixedItemFields:
      type: object
      properties:
        stage: { type: integer, enum: [0, 1, 2], description: "0 = awaiting 2-day review, 1 = awaiting 7-day, 2 = awaiting the final interval" }
        finalIntervalDays: { type: integer, description: "Configurable longest ladder rung, default 30" }
        isComplete: { type: boolean }

    # Present only when mode = ADAPTIVE.
    AdaptiveItemFields:
      type: object
      properties:
        difficulty: { type: number, nullable: true, description: "FSRS Difficulty; null until the item's first Adaptive review" }
        stability: { type: number, nullable: true, description: "FSRS Stability; null until the item's first Adaptive review" }
        lastReviewDate: { type: string, format: date, nullable: true }

    ItemSummary:
      allOf:
        - $ref: '#/components/schemas/ItemCore'
        - oneOf:
            - $ref: '#/components/schemas/FixedItemFields'
            - $ref: '#/components/schemas/AdaptiveItemFields'
        - type: object
          properties:
            preview: { type: string, description: First 80 characters of the item's text }

    ItemDetail:
      allOf:
        - $ref: '#/components/schemas/ItemCore'
        - oneOf:
            - $ref: '#/components/schemas/FixedItemFields'
            - $ref: '#/components/schemas/AdaptiveItemFields'
        - type: object
          properties:
            text: { type: string }
            deletedAt: { type: string, format: date, nullable: true }
            reviews:
              type: array
              items: { $ref: '#/components/schemas/Review' }

  parameters:
    ItemId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              example: { status: ok, redis: not-configured }

  /auth/register:
    post:
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: Must contain at least one letter and one number }
            example: { email: "newuser@example.com", password: "Passw0rd" }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
              example:
                id: 4c55123b-85fc-46e0-a7ce-32843d78e8b4
                email: newuser@example.com
                role: USER
                isSuspended: false
                createdAt: "2026-07-18T09:25:02.196Z"
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      summary: Log in and receive an access token and a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
            example: { email: "demo@example.com", password: "Demo1234" }
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Account is suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many attempts -- rate limited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      summary: Get the logged-in user's own account info
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/change-password:
    post:
      summary: Change the logged-in user's password
      description: >
        Ends every other session: all older access tokens stop working, and
        all refresh tokens are revoked. The answer is a new token pair for
        this session. Rate-limited like login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, description: Must contain at least one letter and one number }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400':
          description: The new password breaks the password rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Wrong current password (INVALID_CREDENTIALS), or missing/invalid access token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many attempts -- rate limited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      summary: Trade a refresh token for a new access token and refresh token
      description: >
        The refresh token is the credential, so no access token is needed.
        The used refresh token is revoked. Presenting an already-used token
        again revokes every token from the same login (reuse detection).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenBody' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: Unknown, expired, revoked or reused token, or the account is suspended (INVALID_REFRESH_TOKEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many attempts -- rate limited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      summary: Log out by revoking a refresh token and its whole login chain
      description: Safe to call twice. An unknown or already-revoked token also gives 204.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenBody' }
      responses:
        '204':
          description: Logged out
        '429':
          description: Too many attempts -- rate limited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /items:
    post:
      summary: Create a new learning item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, date]
              properties:
                text: { type: string, minLength: 1, maxLength: 10000 }
                date: { type: string, format: date, description: "Client's today, YYYY-MM-DD" }
                mode: { type: string, enum: [FIXED, ADAPTIVE], default: FIXED }
                finalIntervalDays: { type: integer, default: 30, description: Fixed Mode only; ignored for Adaptive }
            example: { text: "The mitochondria is the powerhouse of the cell.", date: "2026-07-18" }
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }
    get:
      summary: List own items (paginated, filterable by status)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, archived, all], default: active }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: A page of items
          content:
            application/json:
              example:
                items: []
                page: 1
                limit: 20
                total: 0

  /items/due:
    get:
      summary: List items due on or before a given date
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Items due for review
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemDetail' }

  /items/stats:
    get:
      summary: Aggregate stats for the stats dashboard -- weekly review/skip counts, item counts by mode, and Adaptive grade distribution
      description: >
        `weekly` has one entry per Monday-starting week, all time, from the first week with any
        review or skip. Weeks with no activity are included as 0/0 (not left out). With `date`,
        the list continues up to the week containing that date; without it, the list ends at the
        last active week. No reviews at all gives `[]`. At most the 520 most recent weeks are returned.
      parameters:
        - name: date
          in: query
          required: false
          description: The client's "today" (YYYY-MM-DD). Must be a real calendar date. Optional, so older callers keep working.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Dashboard stats
          content:
            application/json:
              example:
                weekly:
                  - { weekStart: '2026-08-17', reviewed: 12, skipped: 3 }
                  - { weekStart: '2026-08-24', reviewed: 0, skipped: 0 }
                  - { weekStart: '2026-08-31', reviewed: 4, skipped: 1 }
                itemsByMode: { FIXED: 8, ADAPTIVE: 3 }
                adaptiveGrades: { AGAIN: 1, HARD: 2, GOOD: 5, EASY: 1 }
        '400':
          description: Invalid `date` (wrong format or not a real calendar date)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /items/review-history:
    get:
      summary: Review and skip counts per day for one calendar year (the history page)
      description: >
        Sparse: only days with activity are listed. `state` is `full` (reviews
        only) or `half` (any skip that day). Deleted items are left out.
        `currentStreak` is the number of active days in a row up to `date`;
        it is present only when `date` is sent.
      parameters:
        - name: year
          in: query
          required: false
          description: Calendar year, 2000-9999. Defaults to the server's current year.
          schema: { type: integer }
        - name: date
          in: query
          required: false
          description: The client's "today" (YYYY-MM-DD). Must be a real calendar date. Adds `currentStreak`.
          schema: { type: string, format: date }
      responses:
        '200':
          description: The year's active days
          content:
            application/json:
              example:
                year: 2026
                days:
                  - { date: '2026-10-05', reviewCount: 3, skipCount: 0, state: full }
                  - { date: '2026-10-06', reviewCount: 2, skipCount: 1, state: half }
                currentStreak: 2
        '400':
          description: Invalid `year` or `date`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /items/{id}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      summary: Get one item with full text and review history
      responses:
        '200':
          description: Item detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }
        '404':
          description: Not found (missing, deleted, or not yours)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      summary: Edit an item's text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }
    delete:
      summary: Soft-delete an item
      responses:
        '204':
          description: Deleted

  /items/{id}/review:
    post:
      summary: Record a review for a due item and advance its schedule
      description: >
        grade is required for Adaptive Mode items (400 GRADE_REQUIRED if
        missing) and forbidden for Fixed Mode items (400 GRADE_NOT_ALLOWED
        if present) -- Fixed Mode reviews stay the binary REVIEWED/SKIPPED
        they've always been.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                grade: { type: string, enum: [AGAIN, HARD, GOOD, EASY], description: Adaptive Mode only }
            example: { date: "2026-07-18" }
      responses:
        '200':
          description: Item after advancing (or archived, Fixed Mode only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }
        '400':
          description: grade missing for an Adaptive item, or present for a Fixed item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Item is not due yet, or already archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /items/{id}/skip:
    post:
      summary: Skip a due item -- pushes it to the next day
      description: Same for both modes; never touches stage or FSRS state.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
            example: { date: "2026-07-18" }
      responses:
        '200':
          description: Item with nextReviewDate pushed by one day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }
        '400':
          description: Request body carried a grade, which skip never takes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Item is not due yet, or already archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /items/{id}/reset:
    post:
      summary: Wipe an item's progress back to its own mode's start-of-life state
      description: >
        Fixed Mode resets to stage 0, due in 2 days, keeping the item's
        existing finalIntervalDays. Adaptive Mode resets to no
        Difficulty/Stability, due today. Writes no Review row.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
            example: { date: "2026-07-18" }
      responses:
        '200':
          description: Item at its mode's start-of-life state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }

  /items/{id}/mode:
    post:
      summary: Switch an item's scheduling mode
      description: >
        Always a full reset onto the new mode's start-of-life state, never
        a converted carry-over -- the same underlying operation as Reset,
        just possibly landing on a different mode. finalIntervalDays only
        matters when switching to Fixed; if omitted, the item's current
        value carries over.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, date]
              properties:
                mode: { type: string, enum: [FIXED, ADAPTIVE] }
                date: { type: string, format: date }
                finalIntervalDays: { type: integer, description: Fixed Mode only }
            example: { mode: FIXED, date: "2026-07-18", finalIntervalDays: 30 }
      responses:
        '200':
          description: Item at the new mode's start-of-life state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }

  /items/{id}/curve:
    get:
      summary: Memory-decay (retrievability) curve of one Adaptive item
      description: >
        The item's own FSRS stability, turned into the estimated chance of
        recall for each day since its last review (never a mocked line).
        A Fixed item, or an Adaptive item with no graded review yet, has no
        curve: the answer is 200 with `points: []`, not an error, so a
        client can ask for the curve before it knows the item's mode.
        `today` is present only when `date` is sent.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - name: date
          in: query
          required: false
          description: The client's "today" (YYYY-MM-DD). Must be a real calendar date. Adds the `today` marker.
          schema: { type: string, format: date }
      responses:
        '200':
          description: The curve, or an empty list when the item has none
          content:
            application/json:
              examples:
                curve:
                  summary: Adaptive item with a graded review
                  value:
                    points:
                      - { day: 0, retrievability: 1 }
                      - { day: 3.2, retrievability: 0.93 }
                    today: { day: 3, retrievability: 0.94 }
                noCurve:
                  summary: Fixed item, or Adaptive with no graded review
                  value: { points: [] }
        '400':
          description: Invalid `date` (wrong format or not a real calendar date)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found (missing, deleted, or not yours)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /export:
    get:
      summary: Export all of the logged-in user's own data as JSON
      parameters:
        - name: includeDeleted
          in: query
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
      responses:
        '200':
          description: Full data export
          content:
            application/json:
              example:
                user:
                  id: 9c914d83-2668-4ee8-ad7b-dd6d053fafb4
                  email: demo@example.com
                  role: USER
                  isSuspended: false
                  createdAt: "2026-07-18T09:24:45.458Z"
                items:
                  - id: 3f24534e-958b-486c-80d3-7dbd2a3490b1
                    text: "Due today: awaiting the 2-day review."
                    mode: FIXED
                    stage: 0
                    finalIntervalDays: 30
                    dateAdded: "2026-07-16"
                    nextReviewDate: "2026-07-18"
                    isComplete: false
                    deletedAt: null
                    status: active
                    reviews: []

  /admin/users:
    get:
      summary: List all users (admin only)
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              example:
                users: []
                page: 1
                limit: 20
                total: 0
        '403':
          description: Not an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/users/{id}/suspend:
    post:
      summary: Suspend a user (admin only, cannot suspend self or the demo account)
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User suspended
        '403':
          description: Not an admin, attempting to suspend yourself (CANNOT_SUSPEND_SELF), or attempting to suspend the demo account (CANNOT_SUSPEND_DEMO)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/users/{id}/unsuspend:
    post:
      summary: Unsuspend a user (admin only)
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User unsuspended
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
